<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Center Sun Symbol -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Sun Core -->
    <circle cx="0" cy="0" r="88" fill="url(#sunGrad)" />

    <!-- Smiling / Peaceful gentle arc -->
    <path d="M -36,8 Q 0,44 36,8" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round" />

    <!-- Peaceful eyes -->
    <circle cx="-28" cy="-14" r="6" fill="#ea580c" />
    <circle cx="28" cy="-14" r="6" fill="#ea580c" />

    <!-- Sun Rays (8 rays) -->
    <g stroke="url(#sunGrad)" stroke-width="16" stroke-linecap="round">
      <line x1="0" y1="-128" x2="0" y2="-156" />
      <line x1="90" y1="-90" x2="110" y2="-110" />
      <line x1="128" y1="0" x2="156" y2="0" />
      <line x1="90" y1="90" x2="110" y2="110" />
      <line x1="0" y1="128" x2="0" y2="156" />
      <line x1="-90" y1="90" x2="-110" y2="110" />
      <line x1="-128" y1="0" x2="-156" y2="0" />
      <line x1="-90" y1="-90" x2="-110" y2="-110" />
    </g>
  </g>
</svg>
